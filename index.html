<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy | Online Shopping</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        .cart {
            background: white;
            color: #111827;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 55px 20px;
            background: white;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
        }

        .products-section {
            padding: 40px 8%;
        }

        .products-section h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 12px;
            font-size: 21px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        button {
            background: #111827;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .cart-section {
            background: white;
            margin: 20px 8% 50px;
            padding: 30px;
            border-radius: 12px;
        }

        .cart-section h2 {
            margin-bottom: 15px;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ShopEasy</h1>

        <div class="cart">
            🛒 Cart: <span id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <h2>Online Shopping Made Simple</h2>
        <p>Discover products and add them to your cart.</p>
    </section>

    <section class="products-section">

        <h2>Our Products</h2>

        <div id="products">
            Loading products...
        </div>

    </section>

    <section class="cart-section">

        <h2>Your Cart</h2>

        <p id="cartMessage">
            Your cart is empty.
        </p>

    </section>

    <footer>
        <p>© 2026 ShopEasy | PM + Cloud Portfolio Project</p>
    </footer>

    <script>

        let cart = [];

        function addToCart(product) {

            cart.push(product);

            document.getElementById("cartMessage").innerText =
                "Cart: " + cart.join(", ");

            document.getElementById("cartCount").innerText =
                cart.length;
        }

        fetch("products.json")

            .then(response => response.json())

            .then(products => {

                let productHTML = "";

                products.forEach(product => {

                    productHTML += `

                        <div class="product-card">

                            <img
                                src="${product.image}"
                                alt="${product.name}"
                            >

                            <h3>${product.name}</h3>

                            <p class="price">
                                ₹${product.price}
                            </p>

                            <button
                                onclick="addToCart('${product.name}')">
                                Add to Cart
                            </button>

                        </div>

                    `;
                });

                document.getElementById("products").innerHTML =
                    productHTML;

            })

            .catch(error => {

                document.getElementById("products").innerText =
                    "Products load nahi ho pa rahe.";

            });

    </script>

</body>

</html>
