.product-card img {

<body>

    <header>
        <h1>ShopEasy</h1>

        <div class="cart">
            🛒 Cart: <span id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <h2>Online Shopping Made Simple</h2>
        <p>Discover products and add them to your cart.</p>
    </section>

    <section class="products-section">

        <h2>Our Products</h2>
<div class="category-filter">
    <button onclick="filterProducts('All')">All</button>
    <button onclick="filterProducts('Electronics')">Electronics</button>
    <button onclick="filterProducts('Accessories')">Accessories</button>
</div>
<div class="category-filter">
    <button onclick="filterAge('All')">All Ages</button>
    <button onclick="filterAge('18+')">18+</button>
</div>

<div class="category-filter">
    <button onclick="filterGender('All')">All</button>
    <button onclick="filterGender('Men')">Men</button>
    <button onclick="filterGender('Women')">Women</button>
    <button onclick="filterGender('Unisex')">Unisex</button>
</div>        
        <div id="products">
        
    </section>

    <section class="cart-section">

        <h2>Your Cart</h2>

        <p id="cartMessage">
            Your cart is empty.
        </p>

    </section>

    <footer>
        <p>© 2026 ShopEasy | PM + Cloud Portfolio Project</p>
    </footer>
<script>

let cart = [];

const products = [
    {
        name: "Wireless Headphones",
        price: 1999,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?fm=jpg&q=60&w=800&auto=format&fit=crop",
        category: "Electronics",
        ageGroup: "18+",
        gender: "Unisex"
    },
    {
        name: "Smart Watch",
        price: 2499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?fm=jpg&q=60&w=800&auto=format&fit=crop",
        category: "Accessories",
        ageGroup: "18+",
        gender: "Unisex"
    },
    {
        name: "Laptop",
        price: 49999,
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?fm=jpg&q=60&w=800&auto=format&fit=crop",
        category: "Electronics",
        ageGroup: "18+",
        gender: "Unisex"
    }
];

function displayProducts(productList) {

    let productHTML = "";

    productList.forEach(product => {

        productHTML += `
            <div class="product-card">

                ${product.image ? `<img src="${product.image}" alt="${product.name}">` : ""}

                <h3>${product.name}</h3>

                <p class="price">
                    ₹${product.price}
                </p>

                <button onclick="addToCart('${product.name}')">
                    Add to Cart
                </button>

            </div>
        `;

    });

    document.getElementById("products").innerHTML = productHTML;
}

function filterProducts(category) {

    if (category === "All") {
        displayProducts(products);
    } else {
        const filteredProducts = products.filter(
            product => product.category === category
        );

        displayProducts(filteredProducts);
    }
}

function filterAge(age) {

    if (age === "All") {
        displayProducts(products);
    } else {
        const filteredProducts = products.filter(
            product => product.ageGroup === age
        );

        displayProducts(filteredProducts);
    }
}

function filterGender(gender) {

    if (gender === "All") {
        displayProducts(products);
    } else {
        const filteredProducts = products.filter(
            product => product.gender === gender
        );

        displayProducts(filteredProducts);
    }
}

function addToCart(product) {

    cart.push(product);

    document.getElementById("cartMessage").innerText =
        "Cart: " + cart.join(", ");

    document.getElementById("cartCount").innerText =
        cart.length;
}

displayProducts(products);

</script>

</body>

</html>
